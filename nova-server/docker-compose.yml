version: '3.8'
services:
  nova-server:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://novauser:novapass@postgres:5432/novadb?schema=public
    volumes:
      - ./repos:/app/nova_repos
    depends_on:
      - postgres
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: novauser
      POSTGRES_PASSWORD: novapass
      POSTGRES_DB: novadb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
